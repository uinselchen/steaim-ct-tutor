<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STEaiM-CT AI Tutor</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="startscreen">
    <section class="start-card">
      <img class="logo" src="assets/STEaiM_Logo_lowres.png" alt="STEaiM-CT logo" />
      <h1>Welcome!</h1>
      <p class="description">
        Prototype v0.2 of an AI tutor that should give feedback to lesson plans.
      </p>
      <p class="description">
        Tell the tool your country, subject, the age of the children and upload your lesson plan without mentioning any personal data.
      </p>
      <p class="description">
        You are welcome to use your native language of course ;)
      </p>
      <div class="button-row">
        <button class="action-button primary-button" id="startButton">
          <span class="button-icon">✔️</span>
          <span class="button-text">I understand and want to proceed</span>
          <span class="button-arrow">→</span>
        </button>
        <button class="action-button secondary-button" id="infoButton">
          <span class="button-icon">📄</span>
          <span class="button-text">I need more information</span>
          <span class="button-arrow">→</span>
        </button>
        <button class="action-button tertiary-button" id="projectButton">
          <span class="button-icon">ℹ️</span>
          <span class="button-text">Information about the project</span>
          <span class="button-arrow">→</span>
        </button>
      </div>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
